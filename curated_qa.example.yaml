# curated_qa.example.yaml — 预置高质量问答
# 复制为 curated_qa.yaml，填入你准备好的问答
# 部署时自动向量化写入 Vercel KV，直接进入 curated 状态

- question: "请做一个简单的自我介绍"
  answer: |
    我叫张三，5 年全栈开发经验，目前在字节跳动担任高级前端工程师。
    主导过 3 个从 0 到 1 的 B 端产品，日活均超过 10 万。
    最自豪的是将公司前端架构从 Vue2 迁移到 React18，性能提升 40%。

- question: "你做过最有挑战性的项目是哪个？"
  answer: |
    最有挑战的是 ResumeAI 这个开源项目。我在其中负责完整的架构设计：基于 Next.js + Edge Runtime 实现 RAG 管道，通过本地嵌入模型 + 余弦相似度检索实现语义级知识检索。最大的难点是在不依赖外部向量数据库的前提下，保证检索延迟低于 50ms，同时支持知识库自进化。

- question: "你熟悉哪些技术栈？"
  answer: |
    前端以 React 生态为主：TypeScript、Next.js、TailwindCSS。后端比较熟悉 FastAPI + PostgreSQL。AI 方向有 LLM 应用开发经验，包括 RAG 管道设计、Prompt 工程、流式响应优化。DevOps 方面熟悉 Docker、CI/CD、Vercel 部署。

- question: "你为什么离开上一家公司？"
  answer: |
    上一家公司给了我很多成长空间，我在那里完成了从初级到高级工程师的跨越。离开主要是因为我希望找到一个更能发挥我 AI 应用落地能力的平台，特别是在 LLM 和 RAG 方向继续深入。我对 ResumeAI 这个方向非常有热情，所以也想找到理念契合的团队。

- question: "你的团队协作风格是什么样的？"
  answer: |
    我是一个强沟通型的开发者。在字节工作期间，我主导了组件库的跨团队推广，需要跟 3 个业务线的 10+ 位前端沟通需求、收敛设计。我的原则是：技术上可以争论，但决定之后全力执行。Code Review 时我会重点关注业务逻辑的正确性和边界情况，而不是编码风格。

- question: "你的优点和缺点分别是什么？"
  answer: |
    优点是学习能力强、能快速把新技术落地到业务里，比如三个月内把公司架构迁移到 React 18 并沉淀成文档。缺点是有时候容易追求完美、在细节上花的时间偏多，我会有意识地给任务设时间盒来平衡。

- question: "你未来 3-5 年的职业规划是什么？"
  answer: |
    短期希望在 AI 应用落地方向深耕，把 RAG、Agent 这些技术在真实业务里做出成果。中期目标是成长为能独立负责一条业务线技术方案的人。长期想保持对开源的热情，持续用作品说话。

- question: "你平时怎么学习新技术？"
  answer: |
    我习惯"用项目驱动学习"——不只看文档，而是把新技术用到一个小 Demo 或开源项目里验证。比如为了学习 RAG，我直接做了一个 ResumeAI 项目，把检索、流式、部署整个链路都跑通，理解比只看文章深很多。
